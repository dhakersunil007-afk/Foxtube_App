<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxTube - Download Official App</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --bg-dark: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.15) 0%, transparent 40%);
            color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .wrapper {
            max-width: 500px; width: 100%; background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 28px; padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center;
        }
        .app-logo {
            width: 90px; height: 90px; object-fit: cover;
            border-radius: 22px; margin: 0 auto 20px;
            box-shadow: 0 10px 25px var(--primary-glow);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 { font-size: 28px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .badge-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .badge { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #cbd5e1; font-size: 12px; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        .description { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        
        .features-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 25px; text-align: left; }
        .feature-item { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #e2e8f0; }
        .feature-icon { background: rgba(244, 63, 94, 0.15); color: var(--primary); width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

        /* Screenshots Section with Scroll */
        .screenshots-title { font-size: 15px; font-weight: 700; color: #ffffff; margin-bottom: 12px; text-align: left; }
        .screenshots-container {
            display: flex; gap: 12px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 8px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .screenshots-container::-webkit-scrollbar { height: 6px; }
        .screenshots-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .screenshots-container img {
            width: 130px; height: 240px; object-fit: cover; border-radius: 14px;
            border: 1px solid var(--border-color); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .download-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; text-decoration: none;
            padding: 16px; border-radius: 16px; font-weight: 700; font-size: 16px;
            box-shadow: 0 10px 25px var(--primary-glow); transition: all 0.3s ease;
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(244, 63, 94, 0.6); }
        .meta-info { margin-top: 15px; font-size: 12px; color: #64748b; display: flex; justify-content: center; gap: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="logo.png" alt="FoxTube Logo" class="app-logo">
        
        <h1>FoxTube</h1>
        <div class="badge-row">
            <span class="badge">v1.0 Official</span>
            <span class="badge">🛡️ 100% Safe</span>
        </div>
        
        <p class="description">Experience lightning-fast video streaming, seamless background music playback, and an ad-free interface built for Android.</p>
        
        <div class="features-grid">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <div>Ad-free smooth streaming experience</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎵</div>
                <div>Background music & video playback</div>
            </div>
        </div>

        <!-- 9 Screenshots Section (Aap jitne chahein utne yahan rakh sakte hain) -->
        <div class="screenshots-title">App Screenshots</div>
        <div class="screenshots-container">
            <img src="screenshot1.png" alt="Screenshot 1">
            <img src="screenshot2.png" alt="Screenshot 2">
            <img src="screenshot3.png" alt="Screenshot 3">
            <img src="screenshot4.png" alt="Screenshot 4">
            <img src="screenshot5.png" alt="Screenshot 5">
            <img src="screenshot6.png" alt="Screenshot 6">
            <img src="screenshot7.png" alt="Screenshot 7">
            <img src="screenshot8.png" alt="Screenshot 8">
            <img src="screenshot9.png" alt="Screenshot 9">
        </div>

        <!-- Download Button -->
        <a href="https://github.com/dhakersunil007-afk/Foxtube_App/raw/refs/heads/main/website.apk" class="download-btn">
            <span>Download APK Now</span>
            <span>↓</span>
        </a>
        
        <div class="meta-info">
            <span>Size: ~15 MB</span><span>•</span><span>Android 7.0+</span>
        </div>
    </div>
</body>
</html>
